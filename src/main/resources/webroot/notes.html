<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <link rel="stylesheet" href="notes.css">
    
</head>
<body>
    <h1 style="text-align: center; color: white;">Create Notes</h1>
    <form id="greeting">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Write your name">
        <button type="button" onclick="notes.greeting(document.getElementById('name').value)">Get greeted</button>
        <span id="greetingMessage"></span>
    </form>

    <form id="noteForm">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" placeholder="Write the note's title" required>

        <label for="group">Group</label>
        <select id="group" name="group" required>
            <option value="">Select a group</option>
            <option value="personal">Personal</option>
            <option value="work">Work</option>
            <option value="studies">Studies</option>
            <option value="other">Other</option>
        </select>
        <label for="content">Content</label>
        <textarea id="content" name="content" rows="5" placeholder="Write the note's content" required></textarea>
        <button type="button" onclick="notes.addNote(document.getElementById('title').value,document.getElementById('group').value, document.getElementById('content').value)">Save</button>
        <button type="button" id="showNotesButton", onclick="notes.getNotes()">Show notes</button>
    </form>

    <div id="notesContainer"></div>

    <script src ="apiClient.js"></script>
    <script src="notes.js"></script>
</body>
</html>
